<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dice Premium Telegram</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-main: #060709;
            --bg-card: #0f111a;
            --bg-button: #171a26;
            --border-neon: #222739;
            --neon-cyan: #00ffcc;
            --neon-gold: #ffca28;
            --neon-green: #2ecc71;
            --neon-red: #ff4757;
            --text-main: #ffffff;
            --text-muted: #718093;
            --radius-premium: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-top: calc(env(safe-area-inset-top) + 4px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 4px);
            padding-left: 16px;
            padding-right: 16px;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes diceShakeAnimation {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.1) rotate(-15deg) translate(-5px, 5px); }
            40% { transform: scale(0.95) rotate(20deg) translate(5px, -5px); }
            60% { transform: scale(1.05) rotate(-10deg) translate(-3px, -2px); }
            80% { transform: scale(0.98) rotate(10deg) translate(3px, 2px); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes resultPop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
        }
        .premium-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 6px;
            border-bottom: 1px solid #222739;
            margin-bottom: 4px;
        }

        .header-left-zone {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-back-trigger {
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            color: #ffffff;
            transition: transform 0.2s ease;
        }

        .app-back-trigger:active {
            transform: scale(0.85);
        }

        .brand-headline {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, #718093);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .server-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-transform: uppercase;
        }

        .status-pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: corePulseGlow 1.6s infinite ease-in-out;
        }

        .history-carousel-container {
            position: relative;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .history-scroll-track {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            width: 100%;
            padding: 2px 0;
        }

        .history-scroll-track::-webkit-scrollbar {
            display: none;
        }

        .history-node {
            min-width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-main);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(135deg, var(--bg-button), #24293d);
            transition: transform 0.15s ease;
        }

        .history-node.n-gold {
            background: linear-gradient(135deg, var(--neon-gold), #ffa502);
            color: #060709;
            box-shadow: 0 0 10px rgba(255,202,40,0.4);
        }

        .roulette-viewport-widget {
            position: relative;
            width: 100%;
            background: linear-gradient(180deg, var(--bg-card) 0%, #0c0e17 100%);
            border: 1px solid var(--border-neon);
            border-radius: 32px;
            padding: 26px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.75);
        }

        .dice-table-arena {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin: 20px 0;
            min-height: 90px;
        }

        .dice-cube-face {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            border-radius: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 -4px 8px rgba(0,0,0,0.15);
            position: relative;
            box-sizing: border-box;
        }

        .dice-shaking-active {
            animation: diceShakeAnimation 0.4s ease-in-out infinite;
        }
        .dice-dot-point {
            background-color: #1e293b;
            border-radius: 50%;
            width: 12px;
            height: 12px;
            margin: auto;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
        }

        .widget-payout-box {
            font-size: 20px;
            font-weight: 900;
            color: var(--neon-green);
            margin-top: 14px;
            min-height: 28px;
            text-shadow: 0 0 16px rgba(5, 196, 107, 0.6);
            letter-spacing: 0.3px;
        }

        .wallet-display-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .wallet-neon-badge {
            background: linear-gradient(180deg, #131722 0%, var(--bg-card) 100%);
            padding: 10px 18px;
            border-radius: var(--radius-premium);
            font-weight: 900;
            color: var(--neon-gold);
            border: 1px solid var(--border-neon);
            font-size: 16px;
            text-shadow: 0 0 10px rgba(255, 192, 72, 0.3);
        }

        .dice-selectors-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .dice-target-trigger {
            background: linear-gradient(180deg, var(--bg-card) 0%, #121422 100%);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 16px 0;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.1s, border-color 0.2s;
        }

        .dice-target-trigger:active {
            transform: scale(0.96);
        }

        .dice-target-trigger .trigger-title {
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .dice-target-trigger .trigger-coef {
            font-size: 11px;
            color: var(--neon-gold);
            font-weight: 800;
            background: rgba(255,202,40,0.1);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .dice-target-trigger.is-selected-mode {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 14px rgba(0,255,204,0.25);
            background: linear-gradient(180deg, #111e2e 0%, var(--bg-card) 100%);
        }
        .bet-sizing-chassis {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .bet-sizing-chassis input {
            flex: 1;
            background: #040508;
            border: 1px solid var(--border-neon);
            color: var(--text-main);
            padding: 16px;
            border-radius: var(--radius-premium);
            font-size: 18px;
            font-weight: 900;
            outline: none;
            text-align: center;
            font-family: monospace;
        }

        .size-math-trigger {
            background: linear-gradient(180deg, #1e2235 0%, var(--bg-button) 100%);
            border: 1px solid var(--border-neon);
            color: var(--text-main);
            width: 60px;
            border-radius: var(--radius-premium);
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .size-math-trigger:active {
            transform: scale(0.92);
        }

        .dice-roll-main-btn {
            background: linear-gradient(135deg, #007aff, #0040ff);
            color: #fff;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: var(--radius-premium);
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,122,255,0.3);
            transition: transform 0.1s;
        }

        .dice-roll-main-btn:active {
            transform: scale(0.97);
        }

        .provably-fair-zone {
            width: 100%;
            max-width: 360px;
            margin: 4px auto;
            font-size: 10px;
            font-family: monospace;
            color: #4b5563;
            text-align: center;
            word-break: break-all;
            opacity: 0.5;
        }

        .pf-hash-inline {
            display: inline;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="premium-header">
            <div class="header-left-zone">
                <span class="app-back-trigger" onclick="window.parent.postMessage('close_game', '*')">&#x2039;</span>
                <h1 class="brand-headline">Dice 7 Premium</h1>
            </div>
            <div class="server-status-pill">
                <span class="status-pulse-dot"></span>
                <span>TG Cloud Sync</span>
            </div>
        </header>

        <div class="history-carousel-container">
            <div class="history-scroll-track" id="history-box"></div>
        </div>
        <div class="roulette-viewport-widget">
            <div id="dice-status-msg" class="widget-central-status-label">Выберите исход и ставку</div>
            
            <div class="dice-table-arena">
                <div class="dice-cube-face" id="dice-1"></div>
                <div class="dice-cube-face" id="dice-2"></div>
            </div>

            <div id="win-display" class="widget-payout-box"></div>
        </div>

        <div class="wallet-display-row">
            <span>BALANCE</span>
            <div class="wallet-neon-badge"><span id="bal">0</span> W</div>
        </div>
        <div class="dice-selectors-board">
            <div class="dice-target-trigger is-selected-mode" id="mode-under" onclick="selectDiceTargetMode('under')">
                <span class="trigger-title">Меньше 7</span>
                <span class="trigger-coef">x2.1</span>
            </div>
            <div class="dice-target-trigger" id="mode-seven" onclick="selectDiceTargetMode('seven')">
                <span class="trigger-title">Ровно 7</span>
                <span class="trigger-coef">x5.8</span>
            </div>
            <div class="dice-target-trigger" id="mode-over" onclick="selectDiceTargetMode('over')">
                <span class="trigger-title">Больше 7</span>
                <span class="trigger-coef">x2.1</span>
            </div>
        </div>

        <div class="bet-input-area bet-sizing-chassis">
            <button class="size-math-trigger" onclick="modifyBet('multiply')">x2</button>
            <input type="number" id="bet-value" value="50" min="5">
            <button class="size-math-trigger" onclick="modifyBet('divide')">/2</button>
        </div>

        <div class="fast-chips-tray" style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%;">
            <button class="premium-chip-trigger" onclick="addChip(10)">+10</button>
            <button class="premium-chip-trigger" onclick="addChip(100)">+100</button>
            <button class="premium-chip-trigger" onclick="addChip(1000)">+1K</button>
            <button class="premium-chip-trigger" onclick="addChip(25000)">+25K</button>
        </div>

        <button class="dice-roll-main-btn" id="roll-action-btn" onclick="executePremiumDiceRoll()">Бросить кубики</button>
        <div class="provably-fair-zone">SHA-256: <div class="pf-hash-inline" id="game-md5-hash">WAIT...</div></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        let balance = 0;
        let selectedMode = "under";
        let isRolling = false;
        let serverRoundHistory = [];
        let currentRoundNonce = 1;
        let currentServerSeed = "";
        let currentServerHash = "";

        function triggerTelegramHaptic(type) {
            try {
                if (tg.HapticFeedback) {
                    if (type === 'click') tg.HapticFeedback.impactOccurred('medium');
                    if (type === 'shake') tg.HapticFeedback.impactOccurred('light');
                    if (type === 'win') tg.HapticFeedback.notificationOccurred('success');
                    if (type === 'lose') tg.HapticFeedback.notificationOccurred('error');
                }
            } catch (e) {}
        }

        function loadBalanceFromTelegramCloud() {
            try {
                tg.CloudStorage.getItem('wog_offline_balance', (error, value) => {
                    if (!error && value) {
                        balance = parseInt(value);
                        if (isNaN(balance)) balance = 5000;
                    } else {
                        balance = parseInt(localStorage.getItem('wog_offline_balance')) || 5000;
                    }
                    localStorage.setItem('wog_offline_balance', balance);
                    document.getElementById('bal').innerText = balance.toLocaleString();
                });
            } catch (e) {
                balance = parseInt(localStorage.getItem('wog_offline_balance')) || 5000;
                document.getElementById('bal').innerText = balance.toLocaleString();
            }
        }

        async function sha256Hex(msg) {
            const buf = new TextEncoder().encode(msg);
            const hash = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function genRandomHex(l) {
            let c = 'abcdef0123456789', r = '';
            for(let i=0; i<l; i++) r += c[Math.floor(Math.random()*16)];
            return r;
        }

        function selectDiceTargetMode(mode) {
            if (isRolling) return;
            triggerTelegramHaptic('click');
            selectedMode = mode;
            document.querySelectorAll('.dice-target-trigger').forEach(b => b.classList.remove('is-selected-mode'));
            if (mode === 'under') document.getElementById('mode-under').classList.add('is-selected-mode');
            if (mode === 'seven') document.getElementById('mode-seven').classList.add('is-selected-mode');
            if (mode === 'over') document.getElementById('mode-over').classList.add('is-selected-mode');
        }
        const diceDotPositionsMap = {
            1:,
            2:,
            3:,
            4:,
            5:,
            6: [0, 2, 3, 5, 6, 8]
        };

        function renderDiceCubeFaceDots(elId, value) {
            const cube = document.getElementById(elId);
            if (!cube) return;
            cube.innerHTML = "";
            for (let i = 0; i < 9; i++) {
                const node = document.createElement('div');
                if (diceDotPositionsMap[value].includes(i)) {
                    node.className = "dice-dot-point";
                }
                cube.appendChild(node);
            }
        }

        async function initProvablyFairDiceCrypto() {
            currentServerSeed = genRandomHex(32);
            currentServerHash = await sha256Hex(currentServerSeed);
            document.getElementById('game-md5-hash').innerText = currentServerHash;
        }

        async function executePremiumDiceRoll() {
            if (isRolling) return;
            triggerTelegramHaptic('click');
            
            let betAmt = parseInt(document.getElementById('bet-value').value) || 0;
            if (betAmt <= 0 || betAmt > balance) {
                alert("Недостаточно монет на балансе!");
                return;
            }

            isRolling = true;
            balance -= betAmt;
            localStorage.setItem('wog_offline_balance', balance);
            document.getElementById('bal').innerText = balance.toLocaleString();
            
            document.getElementById('win-display').innerText = "";
            document.getElementById('dice-status-msg').innerText = "КУБИКИ БРОШЕНЫ...";

            let combo = `${currentServerSeed}-${currentRoundNonce}`;
            let sig = await sha256Hex(combo);
            let decimal1 = parseInt(sig.substring(0, 8), 16);
            let decimal2 = parseInt(sig.substring(8, 16), 16);
            
            let val1 = (decimal1 % 6) + 1;
            let val2 = (decimal2 % 6) + 1;
            let finalSum = val1 + val2;

            const d1 = document.getElementById('dice-1');
            const d2 = document.getElementById('dice-2');
            d1.classList.add('dice-shaking-active');
            d2.classList.add('dice-shaking-active');

            let shakeCount = 0;
            let shakeInterval = setInterval(() => {
                renderDiceCubeFaceDots('dice-1', Math.floor(Math.random() * 6) + 1);
                renderDiceCubeFaceDots('dice-2', Math.floor(Math.random() * 6) + 1);
                triggerTelegramHaptic('shake');
                shakeCount++;
                if (shakeCount >= 6) {
                    clearInterval(shakeInterval);
                    d1.classList.remove('dice-shaking-active');
                    d2.classList.remove('dice-shaking-active');
                    
                    renderDiceCubeFaceDots('dice-1', val1);
                    renderDiceCubeFaceDots('dice-2', val2);
                    calculateDiceWinnings(finalSum, betAmt);
                }
            }, 100);
        }
        function calculateDiceWinnings(sum, wager) {
            isRolling = false;
            let winAmount = 0;
            let playerWon = false;

            if (selectedMode === "under" && sum < 7) {
                winAmount = Math.floor(wager * 2.1);
                playerWon = true;
            } else if (selectedMode === "seven" && sum === 7) {
                winAmount = Math.floor(wager * 5.8);
                playerWon = true;
            } else if (selectedMode === "over" && sum > 7) {
                winAmount = Math.floor(wager * 2.1);
                playerWon = true;
            }

            balance += winAmount;
            localStorage.setItem('wog_offline_balance', balance);
            document.getElementById('bal').innerText = balance.toLocaleString();

            try {
                tg.CloudStorage.setItem('wog_offline_balance', balance.toString());
            } catch (e) {}

            document.getElementById('dice-status-msg').innerHTML = "Сумма: <strong style='color:var(--neon-cyan);'>" + sum + "</strong>";
            let wDisp = document.getElementById('win-display');

            if (playerWon) {
                wDisp.style.color = "var(--neon-green)";
                wDisp.innerText = "ВЫИГРЫШ: +" + winAmount.toLocaleString() + " W!";
                triggerTelegramHaptic('win');
            } else {
                wDisp.style.color = "var(--neon-red)";
                wDisp.innerText = "СТАВКА НЕ СЫГРАЛА";
                triggerTelegramHaptic('lose');
            }

            serverRoundHistory.unshift({ total: sum, hit: playerWon });
            if (serverRoundHistory.length > 10) serverRoundHistory.pop();
            renderDiceHistoryRibbon();

            currentRoundNonce++;
            initProvablyFairDiceCrypto();
        }

        function renderDiceHistoryRibbon() {
            let box = document.getElementById('history-box');
            if (!box) return;
            box.innerHTML = "";
            serverRoundHistory.forEach(item => {
                let cClass = item.total === 7 ? "n-gold" : "";
                box.innerHTML += `<div class="history-node ${cClass}">${item.total}</div>`;
            });
        }

        function modifyBet(type) {
            if (isRolling) return;
            let input = document.getElementById('bet-value');
            let current = parseInt(input.value) || 0;
            input.value = type === 'multiply' ? current * 2 : Math.max(5, Math.floor(current / 2));
            triggerTelegramHaptic('click');
        }

        function addChip(amount) {
            if (isRolling) return;
            let input = document.getElementById('bet-value');
            let current = parseInt(input.value) || 0;
            input.value = current + amount;
            triggerTelegramHaptic('click');
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadBalanceFromTelegramCloud();
            renderDiceCubeFaceDots('dice-1', 1);
            renderDiceCubeFaceDots('dice-2', 6);
            initProvablyFairDiceCrypto();
        });

        window.addEventListener('focus', () => {
            loadBalanceFromTelegramCloud();
        });
    </script>
</body>
</html>
