<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOG Premium Dice</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #111422;
            --bg-card: #191d30;
            --bg-inner: #222842;
            --border-neon: #2d3554;
            --btn-yellow: #e5b643;
            --btn-green: #3ab95d;
            --btn-red: #e54d61;
            --btn-blue: #2f6bf2;
            --btn-purple: #793bf2;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --radius-premium: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg-main);
            color: var(--text-main);
            padding: 14px;
            padding-top: calc(env(safe-area-inset-top) + 14px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 140px);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-wrapper { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .back-btn {
            background: rgba(47,107,242,0.12);
            color: #8cb0ff;
            border: 1px solid rgba(47,107,242,0.35);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .card {
            background: linear-gradient(180deg, #161a2b 0%, var(--bg-card) 100%);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .top-screen-card { padding: 16px; text-align: center; }
        .status-title { font-size: 15px; font-weight: 900; margin-bottom: 8px; }
        .dice-row { display: flex; justify-content: center; gap: 14px; margin: 12px 0; }
        .die-box {
            width: 44px; height: 44px; border-radius: 10px;
            background: #242b44; border: 1px solid var(--border-neon);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .muted-line { font-size: 12px; color: var(--text-muted); font-weight: 800; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; gap: 10px; }
        .pill { color: #ffd56a; font-family: monospace; font-weight: 900; }
        .bet-box-widget {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #090c15;
            border: 1px solid var(--border-neon);
            border-radius: 10px;
            padding: 4px;
            width: 100%;
        }
        .bet-field {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding-left: 8px;
            font-family: monospace;
        }
        .bet-utility-btn {
            background: var(--bg-inner);
            border: 1px solid var(--border-neon);
            color: var(--text-main);
            font-size: 11px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 4px;
        }
        .quick-bet-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
        .quick-chip-btn, .tab-select-btn, .outcome-card-btn, .even-odd-btn, .cube-select-btn, .premium-roll-btn {
            cursor: pointer;
            border: none;
            color: #ffffff;
        }
        .quick-chip-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            text-align: center;
        }
        .section-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-align: left;
            padding-left: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .main-outcomes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
        .outcome-card-btn {
            border-radius: 10px;
            padding: 12px 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 14px;
            position: relative;
            color: #ffffff;
        }
        .outcome-badge-coef {
            position: absolute;
            bottom: 4px;
            right: 4px;
            font-size: 8px;
            background: rgba(0,0,0,0.15);
            padding: 1px 4px;
            border-radius: 4px;
            color: rgba(255,255,255,0.8);
        }
        .btn-under-style { background: var(--btn-yellow); color: #4c300e !important; }
        .btn-seven-style { background: var(--btn-green); }
        .btn-over-style { background: var(--btn-red); }
        .even-odd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
        .even-odd-btn {
            border-radius: 10px;
            padding: 12px 0;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #ffffff;
        }
        .btn-even-style { background: var(--btn-blue); }
        .btn-odd-style { background: #2a314b; border: 1px solid var(--border-neon); }
        .cubes-grid-32 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
        .cube-select-btn {
            background: var(--btn-purple);
            border-radius: 10px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            position: relative;
        }
        .mini-cube-icon {
            width: 18px; height: 18px; background: #ffffff; color: #000000; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900;
        }
        .tabs-footer-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
        .tab-select-btn {
            border-radius: 10px;
            padding: 12px 0;
            font-weight: 700;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ffffff;
        }
        .selected-bet-active { box-shadow: inset 0 0 0 2px #ffffff, 0 0 12px rgba(255,255,255,0.35); }
        .premium-roll-btn {
            width: 100%;
            background: var(--btn-blue);
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(47, 107, 242, 0.4);
        }
        .premium-roll-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="topbar">
            <button class="back-btn" type="button" id="back-btn">‹ Назад</button>
            <div style="font-size:11px;color:var(--text-muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;">Dice Premium</div>
        </div>

        <div class="card top-screen-card">
            <div id="game-status-label" class="status-title">Сделайте ваши ставки</div>
            <div class="dice-row">
                <div class="die-box" id="result-cube-1">🎲</div>
                <div class="die-box" id="result-cube-2">🎲</div>
            </div>
            <div id="sum-display" class="muted-line">Выпавшее число отобразится здесь</div>
        </div>

        <div class="info-row">
            <span class="muted-line">Ваши ставки: <span id="current-bet-label" class="pill">0 W</span></span>
            <span class="muted-line">Ваш баланс: <span id="balance-display" class="pill">0</span> <span style="color:var(--btn-blue);">W</span></span>
        </div>

        <div class="bet-box-widget">
            <div class="bet-input-wrapper">
                <span style="font-size:11px;color:var(--text-muted);font-weight:800;padding-left:4px;text-transform:uppercase;">Ставка</span>
                <input type="number" id="bet-input" class="bet-field" value="100" min="1">
            </div>
            <div style="display:flex;gap:4px;">
                <button class="bet-utility-btn" id="bet-x2" type="button">x2</button>
                <button class="bet-utility-btn" id="bet-half" type="button">/2</button>
            </div>
        </div>

        <div class="quick-bet-row">
            <button class="quick-chip-btn" data-add="10" type="button">+ 10</button>
            <button class="quick-chip-btn" data-add="100" type="button">+ 100</button>
            <button class="quick-chip-btn" data-add="1000" type="button">+ 1K</button>
            <button class="quick-chip-btn" data-add="25000" type="button">+ 25K</button>
        </div>

        <span class="section-title">Стол ставок</span>

        <div id="table-main-view" style="display:flex; flex-direction:column; gap:10px;">
            <div class="main-outcomes-grid">
                <button class="outcome-card-btn btn-under-style" id="bet-under" data-bet="under" type="button">&lt; 7 <span class="outcome-badge-coef">x2.4</span></button>
                <button class="outcome-card-btn btn-seven-style" id="bet-seven" data-bet="seven" type="button">7 <span class="outcome-badge-coef">x5.9</span></button>
                <button class="outcome-card-btn btn-over-style" id="bet-over" data-bet="over" type="button">&gt; 7 <span class="outcome-badge-coef">x2.4</span></button>
            </div>
            <div class="even-odd-grid">
                <button class="even-odd-btn btn-even-style" id="bet-even" data-bet="even" type="button">Четное <span class="outcome-badge-coef">x2</span></button>
                <button class="even-odd-btn btn-odd-style" id="bet-odd" data-bet="odd" type="button">Нечетное <span class="outcome-badge-coef">x2</span></button>
            </div>
            <div class="cubes-grid-32">
                <button class="cube-select-btn" id="bet-c1" data-bet="c1" type="button"><div class="mini-cube-icon">1</div><span class="outcome-badge-coef">x3.2</span></button>
                <button class="cube-select-btn" id="bet-c2" data-bet="c2" type="button"><div class="mini-cube-icon">2</div><span class="outcome-badge-coef">x3.2</span></button>
                <button class="cube-select-btn" id="bet-c3" data-bet="c3" type="button"><div class="mini-cube-icon">3</div><span class="outcome-badge-coef">x3.2</span></button>
                <button class="cube-select-btn" id="bet-c4" data-bet="c4" type="button"><div class="mini-cube-icon">4</div><span class="outcome-badge-coef">x3.2</span></button>
                <button class="cube-select-btn" id="bet-c5" data-bet="c5" type="button"><div class="mini-cube-icon">5</div><span class="outcome-badge-coef">x3.2</span></button>
                <button class="cube-select-btn" id="bet-c6" data-bet="c6" type="button"><div class="mini-cube-icon">6</div><span class="outcome-badge-coef">x3.2</span></button>
            </div>
        </div>

        <div id="table-numbers-view" style="display:none; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%;">
            <button class="even-odd-btn btn-even-style" id="bet-sum2" data-bet="sum2" type="button">2 <span class="outcome-badge-coef">x35.3</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum3" data-bet="sum3" type="button">3 <span class="outcome-badge-coef">x17.6</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum4" data-bet="sum4" type="button">4 <span class="outcome-badge-coef">x11.8</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum5" data-bet="sum5" type="button">5 <span class="outcome-badge-coef">x8.8</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum6" data-bet="sum6" type="button">6 <span class="outcome-badge-coef">x7.1</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum7" data-bet="sum7" type="button">7 <span class="outcome-badge-coef">x5.9</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum8" data-bet="sum8" type="button">8 <span class="outcome-badge-coef">x7.1</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum9" data-bet="sum9" type="button">9 <span class="outcome-badge-coef">x8.8</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum10" data-bet="sum10" type="button">10 <span class="outcome-badge-coef">x11.8</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum11" data-bet="sum11" type="button">11 <span class="outcome-badge-coef">x17.6</span></button>
            <button class="even-odd-btn btn-even-style" id="bet-sum12" data-bet="sum12" type="button">12 <span class="outcome-badge-coef">x35.3</span></button>
            <button class="tab-select-btn" id="numbers-back-btn" type="button" style="background: var(--btn-red); font-size: 11px;">↩ Назад</button>
        </div>

        <div id="table-pairs-view" style="display:none; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%;">
            <button class="even-odd-btn btn-over-style" id="bet-p1" data-bet="p1" type="button">⚀⚀ <span class="outcome-badge-coef">x35.3</span></button>
            <button class="even-odd-btn btn-over-style" id="bet-p2" data-bet="p2" type="button">⚁⚁ <span class="outcome-badge-coef">x35.3</span></button>
            <button class="even-odd-btn btn-over-style" id="bet-p3" data-bet="p3" type="button">⚂⚂ <span class="outcome-badge-coef">x35.3</span></button>
            <button class="even-odd-btn btn-over-style" id="bet-p4" data-bet="p4" type="button">⚃⚃ <span class="outcome-badge-coef">x35.3</span></button>
            <button class="even-odd-btn btn-over-style" id="bet-p5" data-bet="p5" type="button">⚄⚄ <span class="outcome-badge-coef">x35.3</span></button>
            <button class="even-odd-btn btn-over-style" id="bet-p6" data-bet="p6" type="button">⚅⚅ <span class="outcome-badge-coef">x35.3</span></button>
            <button class="even-odd-btn" id="bet-anypair" data-bet="anypair" type="button" style="grid-column: span 2; background: var(--btn-purple); padding: 14px 0;">Любая пара <span class="outcome-badge-coef">x5.9</span></button>
            <button class="tab-select-btn" id="pairs-back-btn" type="button" style="grid-column: span 2; background: var(--btn-red); font-size: 11px; padding: 10px 0;">↩ Назад</button>
        </div>

        <div class="tabs-footer-row">
            <button class="tab-select-btn" id="tab-btn-main" type="button" style="background:#2a314b; color:#00ffcc;">🎯 Главный стол</button>
            <button class="tab-select-btn" id="tab-btn-numbers" type="button" style="background:#1c2130;">🎰 Числа</button>
            <button class="tab-select-btn" id="tab-btn-pairs" type="button" style="background:#1c2130;">🎲 Пары</button>
        </div>

        <button class="premium-roll-btn" id="roll-action-trigger" type="button">Подтвердить ставку</button>
    </div>

    <script src="dice_game.js"></script>
</body>
</html>
