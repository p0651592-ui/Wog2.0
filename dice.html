<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOG Dice</title>
    <!-- ПОДКЛЮЧЕНИЕ ОБНОВЛЕННОЙ СДК TELEGRAM WEB APP -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-main: #0b0e17;
            --bg-card: #151923;
            --bg-inner: #1c2130;
            --border-neon: #222938;
            --neon-blue: #2f6bf2;
            --neon-gold: #ffca28;
            --neon-cyan: #00d2d3;
            --neon-red: #ff3838;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --radius-premium: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            padding-top: calc(env(safe-area-inset-top) + 50px);
            /* ОТСТУП СНИЗУ ДЛЯ ЗАЩИТЫ ОТ НАЕЗДА СИСТЕМНОЙ ПАНЕЛИ TG */
            padding-bottom: calc(env(safe-area-inset-bottom) + 120px);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* КАРТОЧКА БАЛАНСА В ИГРЕ */
        .balance-widget {
            background: linear-gradient(135deg, #181d29 0%, var(--bg-card) 100%);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* ИГРОВАЯ ЗОНА С КУБИКАМИ */
        .dice-game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        /* СТИЛЬНЫЕ ЗD-ПОДОБНЫЕ КУБИКИ */
        .cube {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            color: #0b0e17;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.2);
            transition: transform 0.5s ease;
        }

        .cube.rolling {
            animation: spinCube 0.5s linear infinite;
        }

        @keyframes spinCube {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(0.9); }
        }

        /* КНОПКИ ВЫБОРА ИСХОДА */
        .target-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 16px 0;
        }

        .target-btn {
            background: var(--bg-inner);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 12px 4px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: border-color 0.2s, background 0.2s;
        }

        .target-btn.active {
            border-color: var(--neon-blue);
            background: rgba(47, 107, 242, 0.1);
        }

        .target-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .target-value { font-size: 14px; font-weight: 800; }
        .target-multiplier { font-size: 11px; color: var(--neon-gold); font-weight: 700; }

        /* ПОЛЕ ВВОДА СТАВКИ */
        .bet-container {
            display: flex;
            background: #040508;
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 4px;
            align-items: center;
            margin-bottom: 16px;
        }

        .bet-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding-left: 12px;
            font-family: monospace;
        }

        .bet-action-btn {
            background: var(--bg-inner);
            border: 1px solid var(--border-neon);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 4px;
        }

        .main-play-btn {
            width: 100%;
            background: var(--neon-blue);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(47, 107, 242, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        .main-play-btn:active { transform: scale(0.97); }
        .main-play-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- КАРТОЧКА БАЛАНСА ВНУТРИ ИГРЫ -->
        <div class="balance-widget">
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Ваш кошелёк</span>
                <div style="font-size: 18px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 4px; font-family: monospace;">
                    <span id="balance-display">5000</span>
                    <span style="color: #2f6bf2;">W</span>
                </div>
            </div>
            <div style="font-size: 20px;">🎲</div>
        </div>

        <!-- ГЛАВНОЕ ИГРОВОЕ ОКНО -->
        <div class="dice-game-card">
            <div id="game-status-label" style="font-size: 14px; font-weight: 700; color: var(--text-main);">Сделайте вашу ставку</div>
            
            <!-- ДВА НЕОНОВЫХ ИГРОВЫХ КУБИКА -->
            <div class="dice-container">
                <div class="cube" id="dice-1">1</div>
                <div class="cube" id="dice-2">1</div>
            </div>

            <div id="sum-display" style="font-size: 12px; color: var(--text-muted); font-weight: 800; margin-bottom: 12px; height: 14px;"></div>

            <!-- СЕТКА ВЫБОРА С НОВЫМИ КОЭФФИЦИЕНТАМИ -->
            <div class="target-grid">
                <div class="target-btn active" id="btn-under" onclick="selectTarget('under')">
                    <span class="target-label">Меньше</span>
                    <span class="target-value">&lt; 7</span>
                    <span class="target-multiplier">x2.1</span>
                </div>
                <div class="target-btn" id="btn-seven" onclick="selectTarget('seven')">
                    <span class="target-label">Ровно</span>
                    <span class="target-value">= 7</span>
                    <span class="target-multiplier">x5.8</span>
                </div>
                <div class="target-btn" id="btn-over" onclick="selectTarget('over')">
                    <span class="target-label">Больше</span>
                    <span class="target-value">&gt; 7</span>
                    <span class="target-multiplier">x2.1</span>
                </div>
            </div>

            <!-- ИНТЕРФЕЙС УПРАВЛЕНИЯ СТАВКОЙ -->
            <div class="bet-container">
                <input type="number" id="bet-input" class="bet-input" value="100" min="1">
                <button class="bet-action-btn" onclick="adjustBet('min')">MIN</button>
                <button class="bet-action-btn" onclick="adjustBet('half')">/2</button>
                <button class="bet-action-btn" onclick="adjustBet('x2')">X2</button>
                <button class="bet-action-btn" onclick="adjustBet('max')">MAX</button>
            </div>

            <!-- ГЛАВНАЯ КНОПКА ЗАПУСКА -->
            <button class="main-play-btn" id="play-btn" onclick="rollDice()">Бросить кости</button>
        </div>
    </div>
    <script>
        // Инициализируем Telegram WebApp API
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        const SERVER_URL = "https://onrender.com";
        const MY_ADMIN_ID = 6682822292;

        let userId = MY_ADMIN_ID;
        if (tg) {
            try {
                tg.expand();
                tg.ready();
                
                // АКТИВАЦИЯ НАТИВНОЙ КНОПКИ НАЗАД В ВЕРХНЕЙ ПАНЕЛИ ТЕЛЕГРАМА
                if (tg.BackButton) {
                    tg.BackButton.show();
                    tg.BackButton.offClick();
                    tg.BackButton.onClick(() => {
                        if (tg.BackButton) tg.BackButton.hide();
                        location.href = "index.html";
                    });
                }
            } catch(e) { console.error(e); }
            
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = tg.initDataUnsafe.user.id;
            }
        }

        let playerBalance = 5000;
        let selectedTarget = 'under'; // По умолчанию выбрано "Меньше 7"
        let isRolling = false;

        // ПОДГРУЖАЕМ ТЕКУЩИЙ СЕРВЕРНЫЙ БАЛАНС ПРИ ВХОДЕ В ИГРУ
        fetch(`${SERVER_URL}/api/user`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: userId })
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.balance !== undefined) {
                playerBalance = data.balance;
                updateUI();
            }
        })
        .catch(err => console.log("Используется локальный баланс"));

        function updateUI() {
            document.getElementById('balance-display').innerText = playerBalance;
        }

        // ВЫБОР ИСХОДА СТАВКИ
        function selectTarget(target) {
            if (isRolling) return;
            selectedTarget = target;
            
            document.querySelectorAll('.target-btn').forEach(btn => btn.classList.remove('active'));
            if (target === 'under') document.getElementById('btn-under').classList.add('active');
            if (target === 'seven') document.getElementById('btn-seven').classList.add('active');
            if (target === 'over') document.getElementById('btn-over').classList.add('active');
        }

        // УПРАВЛЕНИЕ ПОЛЕМ ВВОДА СТАВКИ
        function adjustBet(type) {
            if (isRolling) return;
            const input = document.getElementById('bet-input');
            let currentBet = parseInt(input.value) || 100;

            if (type === 'min') currentBet = 10;
            if (type === 'half') currentBet = Math.max(10, Math.floor(currentBet / 2));
            if (type === 'x2') currentBet = Math.min(playerBalance, currentBet * 2);
            if (type === 'max') currentBet = playerBalance;

            input.value = currentBet;
        }

        // ЗАПУСК ИГРЫ И БРОСОК КОСТЕЙ
        function rollDice() {
            if (isRolling) return;
            
            const betInput = document.getElementById('bet-input');
            const bet = parseInt(betInput.value);

            if (isNaN(bet) || bet <= 0) {
                alert("Введите корректную сумму ставки!");
                return;
            }
            if (bet > playerBalance) {
                alert("Недостаточно монет для этой ставки!");
                return;
            }

            isRolling = true;
            document.getElementById('play-btn').disabled = true;
            document.getElementById('game-status-label').innerText = "Кубики вращаются...";
            document.getElementById('sum-display').innerText = "";

            // Запускаем 3D-анимацию вращения кубиков на фронтенде
            const d1 = document.getElementById('dice-1');
            const d2 = document.getElementById('dice-2');
            d1.classList.add('rolling');
            d2.classList.add('rolling');

            if (tg && typeof tg.HapticFeedback === 'object') {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Имитируем вращение 1.2 секунды
            setTimeout(() => {
                // ОТПРАВЛЯЕМ ЗАПРОС НА ВАШ СЕРВЕР RENDER
                fetch(`${SERVER_URL}/api/game/dice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: userId,
                        bet: bet,
                        target: selectedTarget // 'under', 'seven', 'over'
                    })
                })
                .then(res => {
                    if (!res.ok) throw new Error("Ошибка расчета");
                    return res.json();
                })
                .then(data => {
                    // Останавливаем анимацию вращения
                    d1.classList.remove('rolling');
                    d2.classList.remove('rolling');

                    if (data.success) {
                        // Сервер присылает итоговую сумму, разбиваем её на два случайных кубика
                        let totalSum = data.diceSum; // Сумма, которую сгенерировал сервер
                        let val1 = Math.floor(Math.random() * Math.min(6, totalSum - 1)) + 1;
                        if (totalSum - val1 > 6) val1 = totalSum - 6;
                        let val2 = totalSum - val1;

                        // Показываем кубики на экране
                        d1.innerText = val1;
                        d2.innerText = val2;
                        document.getElementById('sum-display').innerText = `Сумма выпавших очков: ${totalSum}`;

                        playerBalance = data.balance;
                        updateUI();

                        if (data.win) {
                            document.getElementById('game-status-label').innerText = `🎉 Выиграно +${data.winAmount} W!`;
                            document.getElementById('game-status-label').style.color = "var(--neon-green)";
                            if (tg && typeof tg.HapticFeedback === 'object') tg.HapticFeedback.notificationOccurred('success');
                        } else {
                            document.getElementById('game-status-label').innerText = `💥 Проигрыш -${bet} W`;
                            document.getElementById('game-status-label').style.color = "var(--neon-red)";
                            if (tg && typeof tg.HapticFeedback === 'object') tg.HapticFeedback.notificationOccurred('error');
                        }
                    }
                    
                    isRolling = false;
                    document.getElementById('play-btn').disabled = false;
                })
                .catch(err => {
                    // Резервный локальный обработчик на случай если Render уснул
                    d1.classList.remove('rolling');
                    d2.classList.remove('rolling');
                    
                    let val1 = Math.floor(Math.random() * 6) + 1;
                    let val2 = Math.floor(Math.random() * 6) + 1;
                    let totalSum = val1 + val2;

                    d1.innerText = val1;
                    d2.innerText = val2;
                    document.getElementById('sum-display').innerText = `Локальный бросок: ${totalSum}`;

                    let isWin = false;
                    let multiplier = 2.1;
                    if (selectedTarget === 'under' && totalSum < 7) isWin = true;
                    if (selectedTarget === 'seven' && totalSum === 7) { isWin = true; multiplier = 5.8; }
                    if (selectedTarget === 'over' && totalSum > 7) isWin = true;

                    if (isWin) {
                        let winAmt = Math.floor(bet * multiplier);
                        playerBalance += (winAmt - bet);
                        document.getElementById('game-status-label').innerText = `🎉 Тест выигрыш! +${winAmt}`;
                    } else {
                        playerBalance -= bet;
                        document.getElementById('game-status-label').innerText = `💥 Тест проигрыш! -${bet}`;
                    }
                    
                    updateUI();
                    isRolling = false;
                    document.getElementById('play-btn').disabled = false;
                });

            }, 1200);
        }
    </script>
</body>
</html>
