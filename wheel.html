<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOG Wheel Plus Premium</title>
    
    <!-- ПОДКЛЮЧЕНИЕ ОБНОВЛЕННОЙ СДК TELEGRAM MINI APPS -->
    <script src="https://telegram.org"></script>
    
    <!-- КРИПТОГРАФИЧЕСКИЙ МОДУЛЬ ДЛЯ ЧЕСТНОЙ ИГРЫ SHA-256 И MD5 НА КЛИЕНТЕ -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        :root {
            --bg-main: #0c0f1d;
            --bg-card: #151a30;
            --bg-inner: #1d233d;
            --border-neon: #29315c;
            --color-red: #e52e4d;
            --color-black: #1e2336;
            --color-green: #10b981;
            --color-blue: #2563eb;
            --color-gold: #f59e0b;
            --color-purple: #6366f1;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --radius-premium: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 14px;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 160px);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .section-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-align: left;
            padding-left: 2px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ИСТОРИЯ ИГР ИЗ СКРИНШОТА */
        .history-card-scroll {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
        }
        .history-card-scroll::-webkit-scrollbar { display: none; }

        .hist-circle {
            min-width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .hist-circle.red { background: var(--color-red); }
        .hist-circle.black { background: var(--color-black); border: 1px solid var(--border-neon); }
        .hist-circle.green { background: var(--color-green); }

        /* ВЕРХНИЙ ИГРОВОЙ ЭКРАН И ХОЛСТ КОЛЕСА */
        .wheel-display-zone {
            background: radial-gradient(circle at center, #1b223c 0%, var(--bg-main) 100%);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 16px 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        /* БОНУСНЫЕ ИКСОТЫ НАД КОЛЕСОМ ИЗ СКРИНШОТА */
        .wp-bonus-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
            justify-content: center;
        }
        .wp-bonus-box {
            background: rgba(15, 26, 48, 0.8);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 8px 12px;
            text-align: center;
            min-width: 80px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .wp-bonus-num { font-size: 18px; font-weight: 900; }
        .wp-bonus-multiplier { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; margin-top: 4px; display: inline-block; text-transform: uppercase; }
        .wp-m100 { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--color-purple); color: #a5b4fc; }
        .wp-m50 { background: rgba(37, 99, 235, 0.2); border: 1px solid var(--color-blue); color: #93c5fd; }

        .wheel-canvas-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        #wheel-render-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
    <style>
        /* ПАНЕЛИ ИНФОРМАЦИИ О СТАВКАХ И БАЛАНСЕ */
        .wp-info-plate {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
        }

        .wp-row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* КНОПКИ КЛАВИАТУРЫ И ВВОДА СТАВКИ */
        .wp-bet-widget {
            display: flex;
            background: #060813;
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            padding: 4px;
            align-items: center;
            width: 100%;
        }

        .wp-input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding-left: 12px;
            font-family: monospace;
        }

        .wp-util-btn {
            background: var(--bg-inner);
            border: 1px solid var(--border-neon);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 800;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 4px;
        }

        .wp-chips-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }

        .wp-chip-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            color: #ffffff;
            padding: 13px 0;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* СТОЛ СТАВОК ИЗ СКРИНШОТА ОДИН В ОДИН */
        .wp-table-layout {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .wp-grid-3 { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 8px; }
        .wp-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .wp-grid-numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }

        .wp-bet-trigger-btn {
            border-radius: 14px;
            padding: 16px 6px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: none;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .wp-badge-x {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 9px;
            color: rgba(255,255,255,0.5);
            font-weight: 700;
            background: rgba(0,0,0,0.2);
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* Индикатор того, что на ячейку сделана ставка */
        .wp-bet-trigger-btn.has-bets-placed::before {
            content: "•";
            color: var(--color-gold);
            position: absolute;
            top: 4px;
            left: 8px;
            font-size: 18px;
        }

        /* ИНДИВИДУАЛЬНЫЕ ЦВЕТА СТОЛА СТАВОК */
        .wp-btn-red { background: var(--color-red); }
        .wp-btn-black { background: var(--color-black); border: 1px solid var(--border-neon); }
        .wp-btn-green { background: var(--color-green); }
        .wp-btn-blue { background: var(--color-blue); }
        .wp-btn-yellow { background: var(--color-gold); color: #2d1a00 !important; }
        .wp-btn-purple { background: var(--color-purple); }
        .wp-btn-neutral { background: #1b203a; border: 1px solid var(--border-neon); }

        .wp-bet-active-glow {
            box-shadow: inset 0 0 0 2px #ffffff, 0 0 16px rgba(255,255,255,0.5);
        }

        /* МОДАЛЬНОЕ ОКНО РЕЗУЛЬТАТОВ РАУНДА («РЕЗУЛЬТАТЫ ИГРЫ») */
        .wp-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .wp-modal-content {
            background: var(--bg-card);
            border: 2px solid var(--border-neon);
            border-radius: 24px;
            padding: 28px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .wp-modal-close-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            color: #ffffff;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .wp-crypto-footer {
            font-size: 10px;
            color: var(--text-muted);
            font-family: monospace;
            text-align: center;
            word-break: break-all;
            line-height: 1.5;
            margin-top: 14px;
            padding: 8px;
            background: #070913;
            border-radius: 10px;
            border: 1px solid rgba(41, 49, 92, 0.3);
            width: 100%;
        }

        /* ПОП-АП С ТАЙМЕРОМ ОБРАТНОГО ОТСЧЕТА ИЗ СКРИНШОТА */
        .wheel-center-popup {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(11, 14, 26, 0.95);
            border: 2px solid var(--border-neon);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            z-index: 5;
            text-align: center;
        }

        .wp-pointer-top {
            position: absolute;
            top: -6px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid var(--color-gold);
            z-index: 6;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- БЕГУЩАЯ ЛЕНТА РЕАЛЬНОЙ ИСТОРИИ ИГР -->
        <div class="history-card-scroll" id="wp-history-line">
            <!-- Сюда JS будет автоматически вставлять кружки выпавших чисел раундов -->
            <div class="hist-circle black">33</div>
            <div class="hist-circle red">9</div>
            <div class="hist-circle red">19</div>
            <div class="hist-circle red">16</div>
            <div class="hist-circle black">20</div>
            <div class="hist-circle black">2</div>
            <div class="hist-circle black">28</div>
        </div>

        <!-- ЗОНА РУЛЕТКИ: СЧАСТЛИВЫЕ ЧИСЛА И ХОЛСТ CANVAS -->
        <div class="wheel-display-zone">
            <!-- 3 РАНДОМНЫХ СЧАСТЛИВЫХ ЧИСЛА С МНОЖИТЕЛЯМИ -->
            <div class="wp-bonus-row" id="wp-lucky-numbers-container">
                <div class="wp-bonus-box">
                    <div class="wp-bonus-num" style="color: var(--color-red);" id="lucky-num-1">25</div>
                    <div class="wp-bonus-multiplier wp-m100" id="lucky-mult-1">100X</div>
                </div>
                <div class="wp-bonus-box">
                    <div class="wp-bonus-num" style="color: var(--color-red);" id="lucky-num-2">30</div>
                    <div class="wp-bonus-multiplier wp-m100" id="lucky-mult-2">100X</div>
                </div>
                <div class="wp-bonus-box">
                    <div class="wp-bonus-num" style="color: #ffffff;" id="lucky-num-3">29</div>
                    <div class="wp-bonus-multiplier wp-m50" id="lucky-mult-3">50X</div>
                </div>
            </div>

            <!-- ИНТЕРФЕЙС CANVAS: РУЛЕТКА И БЕГУЩИЙ ШАРИК -->
            <div class="wheel-canvas-container">
                <div class="wp-pointer-top"></div>
                <canvas id="wheel-render-canvas" width="500" height="500"></canvas>
                
                <!-- ЦЕНТРАЛЬНОЕ ОКНО СОСТОЯНИЯ И ТАЙМЕРА -->
                <div class="wheel-center-popup" id="wp-center-status-box">
                    <div style="font-size: 32px;" id="wp-center-emoji">🤩</div>
                    <div style="font-size: 11px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;" id="wp-center-text">Сделай ставку!</div>
                </div>
            </div>
        </div>
        <!-- ИНФОРМАЦИОННАЯ ПАНЕЛЬ СТАВОК И ТЕКУЩЕГО БАЛАНСА -->
        <div class="wp-info-plate">
            <div class="wp-row-between">
                <span style="font-size: 13px; color: var(--text-muted); font-weight: 700;">Ваши ставки</span>
                <span style="font-size: 15px; font-weight: 800; color: #ffffff;" id="wp-player-total-bet">0 W</span>
            </div>
            <div class="wp-row-between" style="margin-top: 4px;">
                <span style="font-size: 13px; color: var(--text-muted); font-weight: 700;">Ваш баланс</span>
                <div style="font-size: 16px; font-weight: 800; color: var(--color-gold); font-family: monospace;">
                    <span id="wp-balance-display">5000</span> <span style="color: var(--color-blue);">W</span>
                </div>
            </div>
        </div>

        <!-- УПРАВЛЕНИЕ РАЗМЕРОМ СТАВКИ -->
        <div class="wp-bet-widget">
            <span style="font-size: 11px; color: var(--text-muted); font-weight: 800; padding-left: 6px; text-transform: uppercase;">Ставка</span>
            <input type="number" id="wp-bet-field" class="wp-input-field" value="100" min="1">
            <button class="wp-util-btn" onclick="modifyBetSize('x2')">x2</button>
            <button class="wp-util-btn" onclick="modifyBetSize('/2')">/2</button>
        </div>

        <!-- ФИШКИ БЫСТРОГО ДОБАВЛЕНИЯ ИЗ СКРИНШОТА -->
        <div class="wp-chips-grid">
            <button class="wp-chip-btn" onclick="addChipValue(10)">+ 10</button>
            <button class="wp-chip-btn" onclick="addChipValue(100)">+ 100</button>
            <button class="wp-chip-btn" onclick="addChipValue(1000)">+ 1K</button>
            <button class="wp-chip-btn" onclick="addChipValue(25000)">+ 25K</button>
        </div>
        <span class="section-title">Стол ставок</span>

        <!-- СЕКТОР ОБЩИХ СТАВОК (ГЛАВНЫЙ СТОЛ) -->
        <div class="wp-table-layout" id="wp-main-table-view">
            <div class="wp-grid-3">
                <button class="wp-bet-trigger-btn wp-btn-red" id="cell-red" onclick="placeBetOnCell('red')">Красное <span class="wp-badge-x">x2</span></button>
                <button class="wp-bet-trigger-btn wp-btn-green" id="cell-zero" onclick="placeBetOnCell('zero')">0 <span class="wp-badge-x">x30</span></button>
                <button class="wp-bet-trigger-btn wp-btn-black" id="cell-black" onclick="placeBetOnCell('black')">Черное <span class="wp-badge-x">x2</span></button>
            </div>

            <div class="wp-grid-2">
                <button class="wp-bet-trigger-btn wp-btn-blue" id="cell-even" onclick="placeBetOnCell('even')">Четное <span class="wp-badge-x">x2</span></button>
                <button class="wp-bet-trigger-btn wp-btn-yellow" id="cell-odd" onclick="placeBetOnCell('odd')">Нечетное <span class="wp-badge-x">x2</span></button>

                <button class="wp-bet-trigger-btn wp-btn-neutral" id="cell-low" onclick="placeBetOnCell('low')">1 - 18 <span class="wp-badge-x">x2</span></button>

            </div>

            <div class="wp-grid-3" style="grid-template-columns: repeat(3, 1fr);">
                <button class="wp-bet-trigger-btn wp-btn-purple" id="cell-doz1" onclick="placeBetOnCell('doz1')">1 - 12 <span class="wp-badge-x">x3</span></button>

            </button>

            <div>Hash: <span id="wp-crypto-hash-sha256" style="color: var(--text-main);">Генерация раунда...</span></div>
            <div id="wp-crypto-md5-string" style="margin-top: 4px; color: var(--color-gold); display: none;"></div>
        </div>
    </div> <!-- Конец app-wrapper -->

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО РЕЗУЛЬТАТОВ РАУНДА -->
    <div class="wp-modal-overlay" id="wp-result-modal-popup">
        <div class="wp-modal-content">
            <div style="font-size: 13px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Результаты игры</div>

            <button class="wp-modal-close-btn" onclick="closeResultModalPopup()">Закрыть</button>
        </div>
    </div>
    <script>
        // ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP SDK ДЛЯ ОБРАБОТКИ КНОПОК ТЕЛЕФОНА
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            try { 
                tg.expand();
                tg.ready();
                if (tg.BackButton) {
                    tg.BackButton.show();
                    tg.BackButton.offClick();
                    tg.BackButton.onClick(() => {
                        location.href = "index.html";
                    });
                }
            } catch(e) { console.error("Ошибка Telegram SDK:", e); }
        }

        // НАСТРОЙКИ СВЯЗИ С PYTHON-СЕРВЕРОМ RENDER
        const SERVER_URL = "https://onrender.com";
        const MY_ADMIN_ID = 6682822292;
        
        let userId = MY_ADMIN_ID;
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }

        // ГЛОБАЛЬНЫЙ МАССИВ ЧИСЕЛ ЕВРОПЕЙСКОЙ РУЛЕТКИ В СТРОГОМ ПОРЯДКЕ КОЛЕСА
        const WHEEL_NUMBERS = [
            0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
            5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
        ];

        // КАРТА ЦВЕТОВ ДЛЯ КАЖДОГО НОМЕРА НА РУЛЕТКЕ
        const NUMBER_COLORS = {
            0: "green",  1: "red",    2: "black",  3: "red",    4: "black",  5: "red",
            6: "black",  7: "red",    8: "black",  9: "red",    10: "black", 11: "black",
            12: "red",   13: "black", 14: "red",   15: "black", 16: "red",   17: "black",
            18: "red",   19: "red",   20: "black", 21: "red",   22: "black", 23: "red",
            24: "black", 25: "red",   26: "black", 27: "red",   28: "black", 29: "black",
            30: "red",   31: "black", 32: "red",   33: "black", 34: "red",   35: "black",
            36: "red"
        };
        const WHEEL_NUMBERS = [
            0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
            5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
        ];

        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ СОСТОЯНИЯ ИГРОВОГО ДВИЖКА
        let playerBalance = parseInt(localStorage.getItem('wog_secure_balance')) || 5000;
        let activeBetAmount = 100;
        let currentRoundBets = {}; 
        let totalRoundBetSum = 0;
        let isGameSessionActive = false; 
        let countdownTimerInterval = null;
        let secondsRemaining = 20;

        // ПРЕДРАСЧИТАННЫЕ ДАННЫЕ ТЕКУЩЕГО РАУНДА (PROVABLY FAIR)
        let roundSecretSalt = "";
        let roundWinningNumber = 0;
        let roundLuckyNumbersList = [];

        // АВТОМАТИЧЕСКАЯ ГЕНЕРАЦИЯ КЛАВИАТУРЫ ТОЧНЫХ ЧИСЕЛ 1-36
        function buildNumbersKeyboardLayout() {
            const container = document.getElementById('wp-num-keys-generator-box');
            container.innerHTML = "";
            
            // Генерируем клавишу для нуля
            const zeroBtn = document.createElement('button');
            zeroBtn.className = "wp-bet-trigger-btn wp-btn-green";
            zeroBtn.id = "cell-num0";
            zeroBtn.innerHTML = `0 <span class="wp-badge-x">x30</span>`;
            zeroBtn.onclick = () => placeBetOnCell('num0');
            container.appendChild(zeroBtn);

            // Генерируем остальные 36 чисел
            for (let i = 1; i <= 36; i++) {
                const btn = document.createElement('button');
                const btnColorClass = NUMBER_COLORS[i] === 'red' ? 'wp-btn-red' : 'wp-btn-black';
                btn.className = `wp-bet-trigger-btn ${btnColorClass}`;
                btn.id = `cell-num${i}`;
                btn.innerHTML = `${i} <span class="wp-badge-x">x30</span>`;
                btn.onclick = () => placeBetOnCell(`num${i}`);
                container.appendChild(btn);
            }
        }
        buildNumbersKeyboardLayout();
        WHEEL_NUMBERS =;

        // КРИПТОГРАФИЧЕСКИЙ МОДУЛЬ ЧЕСТНОЙ ИГРЫ (PROVABLY FAIR)
        function generateSecureRoundData() {
            // 1. Честно выбираем выигрышный сектор от 0 до 36
            roundWinningNumber = Math.floor(Math.random() * 37);

            // 2. Генерируем 3 уникальных счастливых числа
            let availableNumbers = Array.from({length: 37}, (_, i) => i);
            roundLuckyNumbersList = [];
            
            const multiplierOptions =;

            for (let i = 0; i < 3; i++) {
                let randomIndex = Math.floor(Math.random() * availableNumbers.length);
                let selectedNum = availableNumbers.splice(randomIndex, 1)[0];
                let selectedMult = multiplierOptions[Math.floor(Math.random() * multiplierOptions.length)];
                
                roundLuckyNumbersList.push({
                    num: selectedNum,
                    mult: selectedMult
                });
            }

            // 3. Создаем криптографическую соль (Salt) для защиты от взлома
            roundSecretSalt = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);

            // 4. Формируем проверочную строку раунда (в стиле MD5/String со скриншота)
            let luckyString = roundLuckyNumbersList.map(item => `${item.num}:x${item.mult}`).join(',');
            let rawRoundString = `${roundSecretSalt}|${roundWinningNumber}|lucky:[${luckyString}]`;

            // 5. Вычисляем хэш SHA-256 для вывода игроку в футер
            let calculatedSha256Hash = CryptoJS.SHA256(rawRoundString).toString();
            
            // Выводим хэш на экран (до начала ставок)
            document.getElementById('wp-crypto-hash-sha256').innerText = calculatedSha256Hash;
            
            // Прячем старую строку проверки прошлых игр
            let md5Block = document.getElementById('wp-crypto-md5-string');
            md5Block.style.display = "none";
            md5Block.innerText = `String verify: ${rawRoundString}`;
        }

        // Рендерим плашки Lucky Numbers на экран
        function updateLuckyNumbersUI() {
            for (let i = 0; i < 3; i++) {
                let data = roundLuckyNumbersList[i];
                let numElement = document.getElementById(`lucky-num-${i+1}`);
                let multElement = document.getElementById(`lucky-mult-${i+1}`);
                
                numElement.innerText = data.num;
                multElement.innerText = `${data.mult}X`;

                // Меняем цвет рамки в зависимости от крутизны множителя
                let box = numElement.parentElement;
                if (data.mult >= 300) {
                    box.style.borderColor = "var(--color-gold)";
                    multElement.className = "wp-bonus-multiplier wp-m100";
                } else if (data.mult >= 100) {
                    box.style.borderColor = "var(--color-purple)";
                    multElement.className = "wp-bonus-multiplier wp-m100";
                } else {
                    box.style.borderColor = "var(--color-blue)";
                    multElement.className = "wp-bonus-multiplier wp-m50";
                }
            }
        }
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // ФУНКЦИИ СИНХРОНИЗАЦИИ БАЛАНСА И ОБНОВЛЕНИЯ ЭКРАНА
        function refreshUI() {
            document.getElementById('wp-balance-display').innerText = playerBalance;
            document.getElementById('wp-player-total-bet').innerText = `${totalRoundBetSum} W`;
            localStorage.setItem('wog_secure_balance', playerBalance);
        }

        // РЕГУЛИРОВКА СТАВКИ КНОПКАМИ x2 И /2
        function modifyBetSize(action) {
            if (isGameSessionActive && secondsRemaining <= 0) return;
            let field = document.getElementById('wp-bet-field');
            let current = parseInt(field.value) || 100;

            if (action === 'x2') current = Math.min(playerBalance, current * 2);
            if (action === '/2') current = Math.max(10, Math.floor(current / 2));

            field.value = current;
            activeBetAmount = current;
        }

        // БЫСТРЫЕ ФИШКИ ДОБАВЛЕНИЯ СТАВКИ ИЗ СКРИНШОТА
        function addChipValue(amount) {
            if (isGameSessionActive && secondsRemaining <= 0) return;
            let field = document.getElementById('wp-bet-field');
            let current = parseInt(field.value) || 0;
            
            let targetAmount = current + amount;
            if (targetAmount > playerBalance) targetAmount = playerBalance;
            
            field.value = targetAmount;
            activeBetAmount = targetAmount;
        }

        // ПЕРЕКЛЮЧЕНИЕ ТАБЛИЦ СТАВОК (ОБЩИЙ СТОЛ / КЛАВИАТУРА ЧИСЕЛ)
        function toggleKeyboardLayout(layoutName) {
            const mainView = document.getElementById('wp-main-table-view');
            const numKeysView = document.getElementById('wp-numbers-keyboard-view');
            
            if (layoutName === 'numbers') {
                mainView.style.display = "none";
                numKeysView.style.display = "grid";
            } else {
                mainView.style.display = "flex";
                numKeysView.style.display = "none";
            }
        }
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // МЕХАНИКА РАЗМЕЩЕНИЯ СТАВОК НА ИГРОВОМ СТОЛЕ С ТРИГГЕРОМ ТАЙМЕРА
        function placeBetOnCell(cellId) {
            // Если колесо уже крутится, новые ставки не принимаются
            if (isGameSessionActive && secondsRemaining <= 0) return;

            // Читаем текущее значение размера ставки из инпута
            const inputField = document.getElementById('wp-bet-field');
            activeBetAmount = parseInt(inputField.value) || 0;

            if (activeBetAmount <= 0) {
                alert("Введите корректную сумму ставки!");
                return;
            }

            if (playerBalance < activeBetAmount) {
                alert("Недостаточно монет на балансе!");
                return;
            }

            // Накапливаем ставку на выбранном исходе раунда
            if (!currentRoundBets[cellId]) {
                currentRoundBets[cellId] = 0;
            }
            currentRoundBets[cellId] += activeBetAmount;
            
            // Списываем монеты из баланса и обновляем общую сумму ставок раунда
            playerBalance -= activeBetAmount;
            totalRoundBetSum += activeBetAmount;
            
            // Включаем визуальную подсветку ячейки стола (добавляем белое свечение)
            const targetBtn = document.getElementById(`cell-${cellId}`);
            if (targetBtn) {
                targetBtn.classList.add('wp-bet-active-glow');
                targetBtn.classList.add('has-bets-placed');
            }

            refreshUI();

            // ТРИГГЕР: Если это самая первая ставка, мгновенно запускаем отсчет раунда
            if (!isGameSessionActive) {
                startRoundCountdownTimer();
            }

            // Подаем нативную тактильную отдачу на телефон игрока
            if (tg && typeof tg.HapticFeedback === 'object') {
                tg.HapticFeedback.impactOccurred('light');
            }
        }
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // ЛОГИКА ТАЙМЕРА ОБРАТНОГО ОТСЧЕТА РАУНДА (20 СЕКУНД)
        function startRoundCountdownTimer() {
            isGameSessionActive = true;
            secondsRemaining = 20;

            const emojiElement = document.getElementById('wp-center-emoji');
            const textElement = document.getElementById('wp-center-text');

            emojiElement.innerText = "⏳";
            textElement.innerText = `${secondsRemaining} сек`;

            countdownTimerInterval = setInterval(() => {
                secondsRemaining--;
                
                if (secondsRemaining > 0) {
                    textElement.innerText = `${secondsRemaining} сек`;
                    // Легкая вибрация каждую секунду для динамики
                    if (tg && typeof tg.HapticFeedback === 'object' && secondsRemaining <= 5) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                } else {
                    // Время вышло: останавливаем таймер, закрываем ставки
                    clearInterval(countdownTimerInterval);
                    emojiElement.innerText = "🌀";
                    textElement.innerText = "Крутим!";
                    
                    // Блокируем ввод полей, чтобы игрок ничего не нажал во время анимации
                    document.getElementById('wp-bet-field').disabled = true;

                    // Запускаем физику вращения колеса и качения шарика
                    initiateWheelSpinAnimation();
                }
            }, 1000);
        }
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // ГРАФИЧЕСКИЙ ДВИЖОК CANVAS: ОТРИСОВКА НЕОНОВОГО КОЛЕСА РУЛЕТКИ
        const canvas = document.getElementById('wheel-render-canvas');
        const ctx = canvas.getContext('2d');
        let currentWheelRotationAngle = 0; // Текущий угол поворота самого колеса
        let ballCurrentPhysicsAngle = 0;    // Текущий угол качения шарика

        function drawPremiumRouletteWheel(wheelAngle, ballAngle, displayBall = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const outerRadius = canvas.width / 2 - 10;
            const totalSectors = WHEEL_NUMBERS.length;
            const arcLengthPerSector = (2 * Math.PI) / totalSectors;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(wheelAngle);

            // 1. Рисуем чередующиеся цветные сектора с числами
            for (let i = 0; i < totalSectors; i++) {
                const currentSectorNumber = WHEEL_NUMBERS[i];
                const startAngle = i * arcLengthPerSector - Math.PI / 2 - arcLengthPerSector / 2;
                const endAngle = startAngle + arcLengthPerSector;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, outerRadius, startAngle, endAngle);
                ctx.closePath();

                // Присваиваем цвет сектору
                if (currentSectorNumber === 0) ctx.fillStyle = "#10b981"; // Зеленый Ноль
                else if (NUMBER_COLORS[currentSectorNumber] === "red") ctx.fillStyle = "#e52e4d"; // Красный
                else ctx.fillStyle = "#151a30"; // Темный черный сектор

                ctx.fill();
                
                // Тонкая неоновая обводка каждого сектора
                ctx.strokeStyle = "#29315c";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 2. Отрисовываем цифры внутри секторов колеса
                ctx.save();
                ctx.rotate(startAngle + arcLengthPerSector / 2 + Math.PI / 2);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(currentSectorNumber, 0, -outerRadius + 30);
                ctx.restore();
            }

            // Рисуем внутреннее темное кольцо
            ctx.beginPath();
            ctx.arc(0, 0, outerRadius - 45, 0, 2 * Math.PI);
            ctx.fillStyle = "#0c0f1d";
            ctx.fill();
            ctx.strokeStyle = "#29315c";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        // Первичный рендеринг статичного колеса при загрузке страницы
        drawPremiumRouletteWheel(0, 0, false);
        generateSecureRoundData();
        updateLuckyNumbersUI();
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // ФИЗИЧЕСКИЙ ДВИЖОК: ЗАПУСК ВРАЩЕНИЯ И РАСЧЕТ ТРАЕКТОРИИ ШАРИКА
        function initiateWheelSpinAnimation() {
            // Подсвечиваем плашки Lucky Numbers, чтобы игрок вспомнил бонусные числа перед броском
            updateLuckyNumbersUI();

            const targetSectorIndex = WHEEL_NUMBERS.indexOf(roundWinningNumber);
            const anglePerSector = (2 * Math.PI) / WHEEL_NUMBERS.length;

            // Задаем случайное смещение для колеса, чтобы анимация была непредсказуемой
            const finalWheelRotationAngle = (2 * Math.PI * 4) + (Math.random() * Math.PI * 2);

            // МАТЕМАТИКА ШАРИКА ИЗ СКРИНШОТА: Шарик должен сделать ровно 5 кругов (10 * Math.PI)
            // в противоположную сторону (знак минус) и упасть точно в ячейку выигравшего числа
            const finalBallRotationAngle = -(2 * Math.PI * 5) - (targetSectorIndex * anglePerSector);

            let currentAnimationFrameTime = 0;
            const totalDurationFrames = 240; // Анимация длится ровно 4 секунды (60 кадров/сек * 4)

            function processPhysicsFrame() {
                currentAnimationFrameTime++;

                if (currentAnimationFrameTime <= totalDurationFrames) {
                    // Используем кубическое сглаживание (Cubic Bezier Ease-Out) для реалистичного трения и замедления
                    const cubicProgress = 1 - Math.pow(1 - (currentAnimationFrameTime / totalDurationFrames), 3);

                    // Рассчитываем текущие физические углы на основе прогресса замедления
                    currentWheelRotationAngle = finalWheelRotationAngle * cubicProgress;
                    ballCurrentPhysicsAngle = finalBallRotationAngle * cubicProgress;

                    // Отрисовываем обновленные координаты колеса и шарика
                    drawPremiumRouletteWheel(currentWheelRotationAngle, ballCurrentPhysicsAngle, true);

                    // Рекурсивно вызываем следующий кадр анимации
                    requestAnimationFrame(processPhysicsFrame);
                } else {
                    // Анимация завершена: фиксируем финальный кадр и переходим к начислению монет
                    currentWheelRotationAngle = finalWheelRotationAngle % (2 * Math.PI);
                    ballCurrentPhysicsAngle = finalBallRotationAngle;
                    
                    drawPremiumRouletteWheel(currentWheelRotationAngle, ballCurrentPhysicsAngle, true);
                    finalizeRoundResultsAndPayouts();
                }
            }

            // Запускаем цикл отрисовки
            requestAnimationFrame(processPhysicsFrame);
        }
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // ОБНОВЛЕННАЯ ФУНКЦИЯ DRAW С ОТРЕНДЕРЕННЫМ БЕЛЫМ ШАРИКОМ
        function drawPremiumRouletteWheel(wheelAngle, ballAngle, displayBall = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const outerRadius = canvas.width / 2 - 10;
            const totalSectors = WHEEL_NUMBERS.length;
            const arcLengthPerSector = (2 * Math.PI) / totalSectors;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(wheelAngle);

            // 1. Рисуем чередующиеся цветные сектора с числами
            for (let i = 0; i < totalSectors; i++) {
                const currentSectorNumber = WHEEL_NUMBERS[i];
                const startAngle = i * arcLengthPerSector - Math.PI / 2 - arcLengthPerSector / 2;
                const endAngle = startAngle + arcLengthPerSector;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, outerRadius, startAngle, endAngle);
                ctx.closePath();

                if (currentSectorNumber === 0) ctx.fillStyle = "#10b981"; 
                else if (NUMBER_COLORS[currentSectorNumber] === "red") ctx.fillStyle = "#e52e4d"; 
                else ctx.fillStyle = "#151a30"; 

                ctx.fill();
                
                ctx.strokeStyle = "#29315c";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.save();
                ctx.rotate(startAngle + arcLengthPerSector / 2 + Math.PI / 2);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(currentSectorNumber, 0, -outerRadius + 30);
                ctx.restore();
            }

            // Рисуем внутреннее темное кольцо
            ctx.beginPath();
            ctx.arc(0, 0, outerRadius - 45, 0, 2 * Math.PI);
            ctx.fillStyle = "#0c0f1d";
            ctx.fill();
            ctx.strokeStyle = "#29315c";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            // 2. ОТРИСОВКА ФИЗИКИ БЕГУЩЕГО БЕЛОГО ШАРИКА ИЗ СКРИНШОТА
            if (displayBall) {
                ctx.save();
                ctx.translate(cx, cy);
                // Шарик катится в противоположную сторону по внешнему ободу
                ctx.rotate(ballAngle);

                ctx.beginPath();
                // Радиус орбиты шарика (накладывается четко на цветные ячейки секторов)
                ctx.arc(0, -outerRadius + 22, 9, 0, 2 * Math.PI);
                ctx.fillStyle = "#ffffff"; // Чистый белый глянцевый шарик
                ctx.fill();
                
                // Добавляем шарику объемное неоновое свечение (3D Тень)
                ctx.shadowColor = "#ffffff";
                ctx.shadowBlur = 10;
                ctx.restore();
            }
        }
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // МАТЕМАТИЧЕСКИЙ КАЛЬКУЛЯТОР СТАВОК И НАЧИСЛЕНИЯ КОЭФФИЦИЕНТОВ
        function finalizeRoundResultsAndPayouts() {
            let totalAmountWonThisRound = 0;
            const winningColor = NUMBER_COLORS[roundWinningNumber];

            // 1. Проверяем, попало ли число в список Счастливых чисел текущего раунда
            let luckyMultiplierBonus = 1;
            let isLuckyHit = false;
            
            roundLuckyNumbersList.forEach(bonus => {
                if (Number(bonus.num) === roundWinningNumber) {
                    luckyMultiplierBonus = bonus.mult;
                    isLuckyHit = true;
                }
            });

            // 2. Цикл обхода и расчета всех сделанных ставок игрока
            for (let cellId in currentRoundBets) {
                let betValue = currentRoundBets[cellId];
                if (betValue <= 0) continue;

                // Ставка на Красное (x2)
                if (cellId === 'red' && winningColor === 'red') {
                    totalAmountWonThisRound += betValue * 2;
                }
                // Ставка на Черное (x2)
                else if (cellId === 'black' && winningColor === 'black') {
                    totalAmountWonThisRound += betValue * 2;
                }
                // Ставка на Ноль (x30)
                else if (cellId === 'zero' && roundWinningNumber === 0) {
                    totalAmountWonThisRound += betValue * 30;
                }
                // Ставка на Четное (x2)
                else if (cellId === 'even' && roundWinningNumber !== 0 && roundWinningNumber % 2 === 0) {
                    totalAmountWonThisRound += betValue * 2;
                }
                // Ставка на Нечетное (x2)
                else if (cellId === 'odd' && roundWinningNumber % 2 !== 0) {
                    totalAmountWonThisRound += betValue * 2;
                }
                // Ставка на Малые числа 1-18 (x2)
                else if (cellId === 'low' && roundWinningNumber >= 1 && roundWinningNumber <= 18) {
                    totalAmountWonThisRound += betValue * 2;
                }
                // Ставка на Большие числа 19-36 (x2)
                else if (cellId === 'high' && roundWinningNumber >= 19 && roundWinningNumber <= 36) {
                    totalAmountWonThisRound += betValue * 2;
                }
                // Первая Дюжина 1-12 (x3)
                else if (cellId === 'doz1' && roundWinningNumber >= 1 && roundWinningNumber <= 12) {
                    totalAmountWonThisRound += betValue * 3;
                }
                // Вторая Дюжина 13-24 (x3)
                else if (cellId === 'doz2' && roundWinningNumber >= 13 && roundWinningNumber <= 24) {
                    totalAmountWonThisRound += betValue * 3;
                }
                // Третья Дюжина 25-36 (x3)
                else if (cellId === 'doz3' && roundWinningNumber >= 25 && roundWinningNumber <= 36) {
                    totalAmountWonThisRound += betValue * 3;
                }
                // Проверка точных одиночных чисел рулетки (cellId вида 'num24')
                else if (cellId.startsWith('num')) {
                    let parsedTargetNumber = parseInt(cellId.replace('num', ''));
                    if (parsedTargetNumber === roundWinningNumber) {
                        // Если это точное число И оно стало Счастливым — применяем мега-множитель (до 500Х)!
                        if (isLuckyHit) {
                            totalAmountWonThisRound += betValue * luckyMultiplierBonus;
                        } else {
                            totalAmountWonThisRound += betValue * 30; // Обычная выплата за число x30
                        }
                    }
                }
            }

            // Начисляем выигрыш на баланс игрока
            playerBalance += totalAmountWonThisRound;

            // Вызываем визуальный поп-ап результатов и раскрываем крипто-строку честности
            displayRoundWinnerModalPopup(totalAmountWonThisRound, isLuckyHit, luckyMultiplierBonus);
        }
        WHEEL_NUMBERS =;

        const multiplierOptions =;

        // ВЫВОД МОДАЛЬНОГО ОКНА С РЕЗУЛЬТАТАМИ РАУНДА И ОБНОВЛЕНИЕ ЛЕНТЫ ИСТОРИИ ИГР
        function displayRoundWinnerModalPopup(amountWon, isLuckyHit, luckyBonus) {
            // Заполняем поп-ап выпавшим числом
            document.getElementById('modal-winning-number').innerText = roundWinningNumber;
            
            // Красиво меняем цвет текста выпавшего числа в поп-апе
            const numColor = NUMBER_COLORS[roundWinningNumber];
            if (roundWinningNumber === 0) document.getElementById('modal-winning-number').style.color = "var(--color-green)";
            else if (numColor === 'red') document.getElementById('modal-winning-number').style.color = "var(--color-red)";
            else document.getElementById('modal-winning-number').style.color = "#ffffff";

            // Рендерим плашку множителя (если число счастливое — пишем бонус, иначе пишем стандарт х30)
            const badge = document.getElementById('modal-winning-multiplier-badge');
            if (isLuckyHit) {
                badge.innerText = `LUCKY BONUS x${luckyBonus}!`;
                badge.style.background = "rgba(245, 158, 11, 0.2)";
                badge.style.borderColor = "var(--color-gold)";
                badge.style.color = "#fef08a";
            } else {
                badge.innerText = `x30`;
                badge.style.background = "rgba(16, 185, 129, 0.2)";
                badge.style.borderColor = "var(--color-green)";
                badge.style.color = "#a7f3d0";
            }

            // Текст статуса победы/проигрыша для игрока
            const statusText = document.getElementById('modal-player-win-status-text');
            if (amountWon > 0) {
                statusText.innerHTML = `🎉 Поздравляем! Ваш выигрыш составил:<br><span style="color: var(--color-gold); font-size: 20px; font-weight: 900;">+ ${amountWon} W</span>`;
                if (tg && typeof tg.HapticFeedback === 'object') tg.HapticFeedback.notificationOccurred('success');
            } else {
                statusText.innerText = "В этот раз не повезло. Сделайте новую ставку!";
            }

            // Раскрываем секретную строку MD5 / String проверки честности раунда в футере
            document.getElementById('wp-crypto-md5-string').style.display = "block";

            // Плавно показываем оверлей поп-апа результатов раунда на экране смартфона
            document.getElementById('wp-result-modal-popup').style.display = "flex";

            // ДОБАВЛЕНИЕ НОВОГО ЧИСЛА В НАЧАЛО БЕГУЩЕЙ ЛЕНТЫ ИСТОРИИ ИГР СВЕРХУ
            const historyLine = document.getElementById('wp-history-line');
            const newCircle = document.createElement('div');
            newCircle.className = `hist-circle ${numColor}`;
            newCircle.innerText = roundWinningNumber;
            
            // Вставляем самый свежий раунд на первое место слева
            historyLine.insertBefore(newCircle, historyLine.firstChild);
            
            // Если лента разрослась слишком длинной (больше 10 раундов) — убираем самый старый кружок справа
            if (historyLine.children.length > 10) {
                historyLine.removeChild(historyLine.lastChild);
            }
        }

        // ЗАКРЫТИЕ ПОП-АПА, СБРОС ИГРОВОГО СТОЛА И ГЕНЕРАЦИЯ СЛЕДУЮЩЕГО ХЭША ЧЕСТНОСТИ
        function closeResultModalPopup() {
            document.getElementById('wp-result-modal-popup').style.display = "none";

            // Сбрасываем и очищаем массивы ставок раунда
            currentRoundBets = {};
            totalRoundBetSum = 0;

            // Снимаем белую подсветку и маркеры ставок со всех кнопок стола ставок
            const allTriggerButtons = document.querySelectorAll('.wp-bet-trigger-btn');
            allTriggerButtons.forEach(btn => {
                btn.classList.remove('wp-bet-active-glow');
                btn.classList.remove('has-bets-placed');
            });

            // Разблокируем ввод инпута ставки для нового раунда
            document.getElementById('wp-bet-field').disabled = false;

            // Возвращаем колесо рулетки в исходное нулевое положение на Canvas
            drawPremiumRouletteWheel(0, 0, false);

            // Переключаем игровую фазу: переводим автомат в режим ожидания ставки
            isGameSessionActive = false;

            // СВЕРХВАЖНО: До начала новых ставок генерируем новый хэш SHA-256 следующего раунда!
            generateSecureRoundData();
            updateLuckyNumbersUI();

            // Синхронизируем и сохраняем новый баланс в памяти телефона
            refreshUI();
        }

        // Финальный стартовый рендеринг экрана при открытии игры
        refreshUI();
    </script>
</body>
</html>
