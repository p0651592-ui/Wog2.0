<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOG Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0e17;
            --bg-card: #151923;
            --bg-inner: #1c2130;
            --border-neon: #222938;
            --neon-blue: #2f6bf2;
            --neon-cyan: #00d2d3;
            --neon-gold: #ffca28;
            --neon-green: #05c46b;
            --neon-red: #ff3838;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --radius-premium: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, rgba(47, 107, 242, 0.14), transparent 35%), var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 14px;
            padding-top: calc(env(safe-area-inset-top) + 12px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: rgba(99, 102, 241, 0.12);
            color: #c7d2fe;
            border: 1px solid rgba(99, 102, 241, 0.28);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .profile {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1b2231;
            border: 1px solid var(--border-neon);
            overflow: hidden;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: var(--neon-blue);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-meta {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            font-size: 14px;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .main-card,
        .bet-card,
        .history-card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.34);
        }

        .main-card {
            padding: 16px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .game-badge {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            background: rgba(0, 210, 211, 0.08);
            border: 1px solid rgba(0, 210, 211, 0.22);
            padding: 5px 8px;
            border-radius: 999px;
        }

        .multiplier-box {
            text-align: center;
            padding: 12px 0 14px;
        }

        .multiplier-value {
            font-size: clamp(54px, 18vw, 82px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 0 0 24px rgba(47, 107, 242, 0.24);
        }

        .round-status {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .crash-line {
            margin-top: 12px;
            height: 10px;
            background: #0f1421;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .crash-line > div {
            width: 100%;
            height: 100%;
            transform-origin: left center;
            transform: scaleX(0.05);
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--neon-red));
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .stat-card {
            background: var(--bg-inner);
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            padding: 11px 10px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .stat-value {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 900;
        }

        .bet-card {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 900;
        }

        .bet-row {
            display: flex;
            gap: 10px;
        }

        .bet-row input,
        .auto-row input {
            flex: 1;
            min-width: 0;
            background: #090b11;
            color: var(--text-main);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 800;
            outline: none;
        }

        .quick-bets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .quick-bets button,
        .action-btn,
        .chip-btn {
            border: none;
            border-radius: 12px;
            padding: 12px 10px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .quick-bets button {
            background: #1b2231;
            color: var(--text-main);
            border: 1px solid var(--border-neon);
        }

        .chip-btn {
            background: #1b2231;
            color: var(--text-main);
            border: 1px solid var(--border-neon);
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .action-btn:active,
        .chip-btn:active,
        .quick-bets button:active,
        .back-btn:active {
            transform: scale(0.98);
        }

        .start-btn {
            background: linear-gradient(135deg, var(--neon-blue), #2451b6);
            color: #ffffff;
        }

        .cashout-btn {
            background: linear-gradient(135deg, var(--neon-green), #2ce67e);
            color: #08110b;
        }

        .cashout-btn:disabled,
        .start-btn:disabled,
        .quick-bets button:disabled,
        .back-btn:disabled,
        .chip-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .auto-row {
            display: flex;
            gap: 10px;
        }

        .history-card {
            padding: 14px;
        }

        .history-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .history-strip::-webkit-scrollbar { display: none; }

        .history-pill {
            min-width: 76px;
            border-radius: 999px;
            padding: 8px 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            border: 1px solid var(--border-neon);
            background: #111726;
            white-space: nowrap;
        }

        .history-pill.cash { color: var(--neon-green); border-color: rgba(5,196,107,0.35); }
        .history-pill.crash { color: var(--neon-red); border-color: rgba(255,56,56,0.35); }

        .hint {
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <button class="back-btn" id="back-btn" type="button">← Назад</button>
            <div class="profile">
                <div class="avatar" id="avatar-box">W</div>
                <div class="profile-meta">
                    <div class="profile-name" id="user-name">Загрузка...</div>
                    <div class="profile-sub" id="user-meta">Баланс синхронизируется</div>
                </div>
            </div>
        </div>

        <section class="main-card">
            <div class="title-row">
                <div>
                    <div style="font-size: 18px; font-weight: 900;">Crash</div>
                    <div style="font-size: 12px; color: var(--text-muted); font-weight: 700; margin-top: 2px;">Успей выйти до взрыва</div>
                </div>
                <div class="game-badge">WOG GAME</div>
            </div>

            <div class="multiplier-box">
                <div class="multiplier-value" id="crash-multiplier">1.00x</div>
                <div class="round-status" id="round-status">Ставки открыты</div>
                <div class="crash-line"><div id="crash-progress"></div></div>
                <div class="round-status" style="margin-top: 8px;" id="crash-point-text">Точка краша скрыта до конца раунда</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Баланс</div>
                    <div class="stat-value" id="balance-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Ставка</div>
                    <div class="stat-value" id="available-balance">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Статус</div>
                    <div class="stat-value" id="round-info">Готов</div>
                </div>
            </div>
        </section>

        <section class="bet-card">
            <div class="section-title">Ставка</div>
            <div class="bet-row">
                <input id="bet-value" type="number" inputmode="numeric" min="10" step="10" value="100">
            </div>
            <div class="quick-bets">
                <button data-pct="0.1">10%</button>
                <button data-pct="0.25">25%</button>
                <button data-pct="0.5">50%</button>
                <button data-pct="1">MAX</button>
            </div>
            <div class="auto-row">
                <input id="auto-cashout-value" type="number" value="2.00" step="0.1" min="1.01" placeholder="Auto cashout X">
                <button class="chip-btn" id="quick-add-btn" type="button">+100</button>
            </div>
            <div class="action-row">
                <button class="action-btn start-btn" id="place-bet-btn" type="button">Сделать ставку</button>
                <button class="action-btn cashout-btn" id="cashout-btn" type="button" disabled>Cash Out</button>
            </div>
            <div class="hint">Ставка списывается при входе в раунд. Выплата происходит только при успешном Cash Out.</div>
        </section>

        <section class="history-card">
            <div class="section-title">История раундов</div>
            <div class="history-strip" id="history-track"></div>
        </section>
    </div>

    <script src="crash_game.js" defer></script>
</body>
</html>
