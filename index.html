<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOG Casino Telegram Hub</title>
    <!-- ПРАВИЛЬНОЕ ПОДКЛЮЧЕНИЕ СДК TELEGRAM WEB APP -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-main: #060709;
            --bg-card: #0f111a;
            --bg-button: #171a26;
            --border-neon: #222739;
            --neon-cyan: #00d2d3;
            --neon-gold: #ffca28;
            --neon-green: #05c46b;
            --neon-red: #ff3838;
            --text-main: #ffffff;
            --text-muted: #718093;
            --radius-premium: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            /* Увеличенный отступ снизу до 140px уводит элементы выше навигации TG */
            padding-top: calc(env(safe-area-inset-top) + 15px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 140px);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .tg-profile-card {
            background: linear-gradient(135deg, #121622 0%, var(--bg-card) 100%);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-premium);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .tg-avatar-frame {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            background: #1e2235;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--neon-cyan);
        }

        .tg-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .tg-meta-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tg-username-label 
        <body>

    <div class="app-wrapper">
        <!-- ТЕЛЕГРАМ ПРОФИЛЬ КАРТОЧКА -->
        <div class="tg-profile-card">
            <div class="tg-avatar-frame" id="avatar-container">W</div>
            <div class="tg-meta-info">
                <span class="tg-username-label" id="username-display">Загрузка профиля...</span>
                <span class="tg-status-text" id="status-display">PLAYER</span>
            </div>
        </div>

        <!-- НЕОНОВЫЙ КОШЕЛЕК -->
        <div class="wallet-neon-widget">
            <div class="wallet-title-group">
                <span class="wallet-title-label">Ваш баланс</span>
                <span class="wallet-balance-value" id="balance-display">5000</span>
            </div>
            <div class="sync-spinner-icon" id="sync-btn" onclick="refreshData()">🔄</div>
        </div>

        <!-- СЕТКА МИНИ-ИГР -->
        <div class="games-neon-grid">
            <div class="game-selection-card" onclick="navigateToGame('dice.html')">
                <div class="game-card-icon-row">
                    <span class="game-card-emoji">🎲</span>
                    <span class="game-card-badge">LIVE</span>
                </div>
                <span class="game-card-headline">Кости</span>
                <span class="game-card-subtext">Испытай классическую удачу</span>
            </div>

            <div class="game-selection-card" onclick="navigateToGame('wheel.html')">
                <div class="game-card-icon-row">
                    <span class="game-card-emoji">🎡</span>
                    <span class="game-card-badge">POPULAR</span>
                </div>
                <span class="game-card-headline">Колесо</span>
                <span class="game-card-subtext">Умножай ставки до x50</span>
            </div>

            <div class="game-selection-card full-span-card" onclick="navigateToGame('crash.html')">
                <div class="game-card-icon-row">
                    <span class="game-card-emoji">🚀</span>
                    <span class="game-card-badge" style="color:var(--neon-red); border-color:rgba(255,56,56,0.2);">HIGH RISK</span>
                </div>
                <span class="game-card-headline">Краш-игра</span>
                <span class="game-card-subtext">Забери кэш до того, как ракета улетит в космос</span>
            </div>
        </div>

        <div class="promo-activation-card">
            <span class="wallet-title-label">Промокоды</span>
            <div class="promo-input-wrapper">
                <input type="text" id="promo-input" placeholder="Введите код...">
                <button class="promo-activation-btn" onclick="claimPromoCode()">Ввод</button>
            </div>
        </div>
    </div>

    <!-- СКРЫТАЯ КНОПКА АДМИНКИ -->
    <button class="admin-neon-btn" id="admin-trigger-btn" onclick="openAdminMenu()">⚙️ Админка</button>
    <script>
        // Инициализируем Telegram WebApp API
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            try { 
                tg.expand();
                tg.ready(); // Сообщаем Telegram, что приложение готово передавать профиль
            } catch(e) { console.error(e); }
        }

        const SERVER_URL = "https://onrender.com";
        const MY_ADMIN_ID = 6682822292; // Ваш персональный ID
        
        const tgAuthData = tg ? tg.initData : "";
        const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

        let playerBalance = 5000;
        let userId = MY_ADMIN_ID; 
        let userFirstName = "Разработчик";
        let userUsername = "LocalDev";

        // КРИТИЧЕСКИЙ ФИКС: Умное распределение прав Имя + Роль
        if (tgUser) {
            userId = tgUser.id;
            userFirstName = tgUser.first_name;
            userUsername = tgUser.username || "";

            // Выводим имя обычного игрока или админа на экран
            document.getElementById('username-display').innerText = userFirstName + (userUsername ? ` (@${userUsername})` : '');

            if (Number(userId) === MY_ADMIN_ID) {
                // Если это вы зашли через бота — пишем имя админа и статус /admin
                document.getElementById('status-display').innerText = userFirstName + " / ADMIN";
                document.getElementById('status-display').style.color = "var(--neon-gold)";
                document.getElementById('admin-trigger-btn').style.display = "block"; // Показываем админку
            } else {
                // Если зашел любой другой случайный игрок
                document.getElementById('status-display').innerText = "PLAYER";
                document.getElementById('status-display').style.color = "var(--neon-cyan)";
                document.getElementById('admin-trigger-btn').style.display = "none"; // Прячем админку
            }
            
            // Загружаем аватарку пользователя из Телеграма
            const avatarFrame = document.getElementById('avatar-container');
            if (tgUser.photo_url) {
                avatarFrame.innerHTML = `<img src="${tgUser.photo_url}" class="tg-avatar-img">`;
            } else {
                avatarFrame.innerText = userFirstName.charAt(0).toUpperCase();
            }
        } else {
            // Если открыли просто в браузере (для тестов разработчика)
            document.getElementById('username-display').innerText = "Основатель (Локальный тест)";
            document.getElementById('status-display').innerText = "FOUNDER / ADMIN";
            document.getElementById('status-display').style.color = "var(--neon-gold)";
            document.getElementById('admin-trigger-btn').style.display = "block";
            document.getElementById('avatar-container').innerText = "A";
        }

        // ЗАПРОС НА СЕРВЕР С ВАЛИДАЦИЕЙ СЕССИИ ТЕЛЕГРАМА
        fetch(`${SERVER_URL}/api/user`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: userId,
                first_name: userFirstName,
                username: userUsername,
                auth_data: tgAuthData
            })
        })
        .then(res => {
            if (!res.ok) throw new Error("Сервер не отвечает");
            return res.json();
        })
        .then(data => {
            if (data && data.balance !== undefined) {
                playerBalance = data.balance;
                updateUI();
            }
        })
        .catch(err => {
            console.log("Бэкенд недоступен, включен резервный баланс.");
            updateUI();
        });

        function updateUI() {
            document.getElementById('balance-display').innerText = playerBalance;
        }

        function refreshData() {
            const spinner = document.getElementById('sync-btn');
            spinner.classList.add('spinning');
            setTimeout(() => { location.reload(); }, 300);
        }

        function navigateToGame(pageUrl) {
            localStorage.setItem('wog_player_balance', playerBalance);
            location.href = pageUrl;
        }

        function claimPromoCode() {
            const input = document.getElementById('promo-input');
            const code = input.value.trim().toUpperCase();
            if (!code) return;

            fetch(`${SERVER_URL}/api/promo/activate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: userId, code: code })
            })
            .then(res => {
                if (res.status === 440) throw new Error("Указанный промокод не найден!");
                if (res.status === 400) throw new Error("Промокод исчерпал лимит активаций!");
                if (!res.ok) throw new Error("Ошибка активации кода");
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    playerBalance = data.balance;
                    updateUI();
                    input.value = "";
                    if (tg && typeof tg.showAlert === 'function') tg.showAlert(data.message);
                    else alert(data.message);
                }
            })
            .catch(err => { alert(err.message || "Ошибка соединения с сервером"); });
        }

        function openAdminMenu() {
            let choice = prompt("УПРАВЛЕНИЕ ХАБОМ WOG (БЭКЕНД):\n1 - Начислить монеты на сервере\n2 - Создать промокод на сервере\n3 - Просмотр кодов с сервера", "1");
            if (!choice) return;

            if (choice === "1") {
                let amt = prompt("Сколько монет начислить на баланс?", "100000");
                if (amt && !isNaN(amt)) {
                    fetch(`${SERVER_URL}/api/balance`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: userId, amount: parseInt(amt) })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            playerBalance = data.balance;
                            updateUI();
                            alert("Баланс успешно изменен на сервере!");
                        }
                    })
                    .catch(err => alert("Ошибка обновления баланса"));
                }
            } else if (choice === "2") {
                let name = prompt("Название промокода (Пример: WOGCOINS):");
                if (!name) return;
                name = name.trim().toUpperCase();
                let prize = prompt("Сумма выигрыша по коду:", "5000");
                let count = prompt("Количество возможных использований:", "10");

                if (name && prize && count) {
                    fetch(`${SERVER_URL}/api/promo/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ admin_id: userId, code: name, reward: parseInt(prize), uses: parseInt(count) })
                    })
                    .then(res => res.json())
                    .then(data => { if (data.success) alert(`Промокод ${name} успешно сохранен на сервере Render!`); })
                    .catch(err => alert("Ошибка создания промокода"));
                }
            } else if (choice === "3") {
                fetch(`${SERVER_URL}/api/promo/list`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: userId })
                })
                .then(res => res.json())
                .then(data => {
                    let out = "Список активных промокодов на сервере:\n";
                    let hasKeys = false;
                    for (let k in data) {
                        hasKeys = true;
                        out += `${k} -> Награда: ${data[k].reward} монет (Осталось: ${data[k].uses})\n`;
                    }
                    alert(!hasKeys ? "Промокодов на сервере пока нет" : out);
                })
                .catch(err => alert("Ошибка получения списка"));
            }
        }
    </script>
</body>
</html>
